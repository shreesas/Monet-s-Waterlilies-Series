<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Water Lilies — Morph Preview</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0b; color: #ddd;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    height: 100%; }
  .stage { position: fixed; inset: 0 0 96px 0; display: grid; place-items: center;
    background: #000; }
  .stage img { max-width: 100%; max-height: 100%; display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 96px;
    background: #121212; border-top: 1px solid #222;
    display: grid; grid-template-columns: 160px 1fr 160px; align-items: center;
    padding: 0 24px; gap: 16px; }
  .left, .right { display: flex; align-items: center; gap: 10px; }
  .right { justify-content: flex-end; }
  select { background: #1f1f1f; color: #ddd; border: 1px solid #333;
    border-radius: 4px; padding: 6px 8px; font: inherit; cursor: pointer; }
  button { background: #262626; color: #eee; border: 1px solid #3a3a3a;
    border-radius: 6px; padding: 12px 18px; font: inherit; font-size: 15px;
    cursor: pointer; min-width: 100px; }
  button:hover:not(:disabled) { background: #303030; border-color: #4a4a4a; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .center { text-align: center; }
  .title { font-size: 15px; color: #fff; }
  .meta { font-size: 12px; color: #888; margin-top: 4px;
    font-variant-numeric: tabular-nums; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
  .dot.active { background: #ffb84d; }
  .dot.done { background: #6a5030; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center;
    color: #888; background: #000; z-index: 10; }
  .hint { position: fixed; top: 14px; right: 18px; font-size: 11px;
    color: #666; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="stage"><img id="frame" alt="" /></div>

<div class="bar">
  <div class="left"><button id="prev">← Back</button></div>
  <div class="center">
    <div class="title" id="title">—</div>
    <div class="meta" id="meta">—</div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="right">
    <label style="font-size:12px;color:#888">Speed
      <select id="speed">
        <option value="2000">Fast (2s)</option>
        <option value="4000" selected>Normal (4s)</option>
        <option value="6000">Slow (6s)</option>
        <option value="10000">Very slow (10s)</option>
      </select>
    </label>
    <button id="next">Next →</button>
  </div>
</div>

<div class="hint" id="hint"></div>
<div class="loading" id="loading">loading manifest…</div>

<script>
const params = new URLSearchParams(location.search);
const manifestUrl = params.get('manifest') || 'frames/manifest.json';
const URL_DURATION = +params.get('duration') || null;
const getDuration = () => URL_DURATION || +$('speed').value;

const $ = (id) => document.getElementById(id);

let manifest = null;
let base = '';
let anchorIdx = 0;          // index into manifest.anchors
let anchors = [];           // list of {anchorIndex, transitionIdxBefore, transitionIdxAfter, firstFrameImg}
let transitions = [];       // [{frames: [{img, file, ...}]}], parallel to manifest.transitions
let animating = false;

async function main() {
  const resp = await fetch(manifestUrl);
  if (!resp.ok) { $('loading').textContent = `failed to load ${manifestUrl}: ${resp.status}`; return; }
  manifest = await resp.json();
  base = manifestUrl.replace(/[^/]+$/, '');

  // Build per-transition image lists and kick off preloading
  transitions = manifest.transitions.map(t => ({
    info: t,
    frames: t.frames.map(f => {
      const img = new Image();
      img.src = base + t.folder + '/' + f.file;
      return { img, ...f };
    }),
    loaded: 0,
  }));
  transitions.forEach((t, i) => {
    t.frames.forEach(f => {
      f.img.addEventListener('load', () => { t.loaded++; updateHint(); });
      f.img.addEventListener('error', () => { t.loaded++; updateHint(); });
    });
  });

  // Anchors = unique endpoints of the transition list
  // (each transition[i].end_index == transition[i+1].start_index)
  anchors = [];
  if (transitions.length) {
    anchors.push({
      value: transitions[0].info.start_index,
      frame: transitions[0].frames[0],       // first frame of first transition
    });
    for (const t of transitions) {
      const last = t.frames[t.frames.length - 1];
      anchors.push({ value: t.info.end_index, frame: last });
    }
  }

  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(+1));
  document.addEventListener('keydown', (e) => {
    if (animating) return;
    if (e.key === 'ArrowRight' || e.key === ' ') step(+1);
    else if (e.key === 'ArrowLeft') step(-1);
  });

  $('loading').remove();
  showAnchor(0);
}

function updateHint() {
  const total = transitions.reduce((s, t) => s + t.frames.length, 0);
  const loaded = transitions.reduce((s, t) => s + t.loaded, 0);
  $('hint').textContent = `${loaded}/${total} frames preloaded`;
  if (loaded === total) setTimeout(() => $('hint').textContent = '', 1500);
}

function showAnchor(i) {
  anchorIdx = Math.max(0, Math.min(anchors.length - 1, i));
  const a = anchors[anchorIdx];
  $('frame').src = a.frame.img.src;
  const meta = a.frame;
  $('title').textContent = meta.title || '—';
  const parts = [];
  if (meta.catalog_number) parts.push(meta.catalog_number);
  parts.push(`anchor ${anchorIdx + 1} of ${anchors.length}`);
  $('meta').textContent = parts.join(' · ');

  const dots = $('dots');
  dots.innerHTML = '';
  anchors.forEach((_, k) => {
    const d = document.createElement('div');
    d.className = 'dot' + (k === anchorIdx ? ' active' : (k < anchorIdx ? ' done' : ''));
    dots.appendChild(d);
  });

  $('prev').disabled = anchorIdx === 0;
  $('next').disabled = anchorIdx === anchors.length - 1;
}

function step(dir) {
  if (animating) return;
  const targetAnchor = anchorIdx + dir;
  if (targetAnchor < 0 || targetAnchor >= anchors.length) return;

  // Transition to play: if going forward, play transitions[anchorIdx]; backward, transitions[anchorIdx - 1] in reverse
  const trIdx = dir > 0 ? anchorIdx : anchorIdx - 1;
  const tr = transitions[trIdx];
  const frames = dir > 0 ? tr.frames : [...tr.frames].reverse();
  playFrames(frames, () => showAnchor(targetAnchor));
}

function playFrames(frames, onDone) {
  animating = true;
  $('prev').disabled = true;
  $('next').disabled = true;

  const n = frames.length;
  const durationMs = getDuration();
  const t0 = performance.now();
  const imgEl = $('frame');
  let last = -1;

  function tick(now) {
    const p = Math.min(1, (now - t0) / durationMs);
    const idx = Math.min(n - 1, Math.floor(p * (n - 1) + 0.5));
    if (idx !== last) {
      imgEl.src = frames[idx].img.src;
      last = idx;
    }
    if (p < 1) requestAnimationFrame(tick);
    else { animating = false; onDone(); }
  }
  requestAnimationFrame(tick);
}

main().catch(e => { $('loading').textContent = 'error: ' + e.message; });
</script>
</body>
</html>
